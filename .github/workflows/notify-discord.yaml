name: Reusable Workflow For Notify Discord

on:
  workflow_call:
    inputs:
      status: 
        required: true
        type: string
      environment:
        required: true
        type: string
      related-link:
        required: true
        type: string
      image-tag:
        required: true
        type: string
  
jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv run python scripts/notify-discord.py \
          --webhook_url=${{ secrets.DISCORD_DEPLOY_WEBHOOK_URI }} \
          --status=${{ inputs.status }} \
          --env=${{ inputs.environment }} \
          --repo=${{ github.repository }} \
          --related_link="${{ inputs.related-link }}" \
          --tag=${{ inputs.image-tag }}
