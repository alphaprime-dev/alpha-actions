name: Reusable Workflow For Build-Push to Google Artifact Registry
on:
  workflow_call:
    inputs:
      gar-region:
        type: string
        default: "asia-northeast3"
      gar-project-id:
        required: true
        type: string
      gar-repository:
        required: true
        type: string
      service-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      workload-identity-provider:
        required: true
        type: string
      service-account:
        required: true
        type: string
      target:
        required: false
        type: string
      submodules:
        required: false
        type: string
        default: "recursive"
      github-repositories:
        description: "Comma/newline-separated repository names including the caller and private dependencies; empty uses all App installation repositories."
        required: false
        type: string
    secrets:
      ALPHA_ACTIONS_APP_ID:
        required: true
      ALPHA_ACTIONS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.ALPHA_ACTIONS_APP_ID }}
          private-key: ${{ secrets.ALPHA_ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.github-repositories }}
          permission-contents: read

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: "access_token"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.gar-region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ inputs.gar-region }}-docker.pkg.dev/${{ inputs.gar-project-id }}/${{ inputs.gar-repository }}/${{ inputs.service-name }}:${{ inputs.image-tag }}
          target: ${{ inputs.target || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "github_token=${{ steps.app-token.outputs.token }}"
